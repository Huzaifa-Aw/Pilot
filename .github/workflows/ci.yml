name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pilot
          POSTGRES_USER: pilot
          POSTGRES_PASSWORD: pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pilot -d pilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pilot:pilot@localhost:5432/pilot?schema=public
      DIRECT_URL: postgresql://pilot:pilot@localhost:5432/pilot?schema=public
      AUTH_SECRET: ci-only-not-used
      AUTH_URL: http://127.0.0.1:3100
      E2E_TEST_PASSWORD: E2E-CI-Only-Password-2026
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
